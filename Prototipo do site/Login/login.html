<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Centro de Desenvolvimento Regional</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="menu-icon" id="menu-icon">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="logo">
            <img src="/assets/logo.png" alt="Logo do Centro de Desenvolvimento Regional"> 
            <div class="logo-text">
                
            </div>
        </div>
    </header>

    <nav class="side-menu">
        <div class="close-menu" id="close-menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <ul>
            <li><span class="menu-button active">Login</span></li>
            <li><a href="../Tela inicial/index.html" class="menu-button">Home</a></li>
            <li><a href="../Blog/blog.html" class="menu-button">Blog</a></li>
            <li><a href="#" class="menu-button">Projetos</a></li>
            <li><a href="#" class="menu-button">Legislação</a></li>
            <li><a href="../Fale Conosco/faleconosco.html" class="menu-button">Contato</a></li>
        </ul>
    </nav>

    <main class="login-content">
        <div class="login-card">
            <h2>Acesso ao Sistema</h2>
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-button">Entrar</button>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </form>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
