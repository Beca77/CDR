<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="menu-icon" id="menu-icon">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="logo">
            <img src="/assets/logo.png" alt="Logo do Centro de Desenvolvimento Regional">
            <div class="logo-text">
            </div>
        </div>
    </header>

    <nav class="side-menu">
        <div class="close-menu" id="close-menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <ul>
            <li><a href="#" class="menu-button">Login</a></li>
            <li><a href="../Tela inicial/index.html" class="menu-button">Home</a></li>
            <li><a href="../Blog/blog.html" class="menu-button">Blog</a></li>
            <li><a href="#" class="menu-button">Projetos</a></li>
            <li><a href="#" class="menu-button">Legislação</a></li>
            <li><span class="menu-button active">Contato</span></li>
        </ul>
    </nav>

    <main class="contact-content">
        <div class="contact-info-card">
            <h2>Informações de Contato</h2>
            <p><strong>Endereço:</strong></p>
            <p>Alameda Madrid, 545 — Jardim Sevilha,</p>
            <p>Gurupi — TO</p>
            <p>CEP: 77410-470</p>
            <br>
            <p><strong>E-mail:</strong></p>
            <p><a href="mailto:edrsultocantins@unirg.edu.br">edrsultocantins@unirg.edu.br</a></p>
            <br>
            <p>Preencha o formulário ao lado e entraremos em contato em breve.</p>
        </div>

        <div class="send-message-card">
            <h2>Envie sua mensagem</h2>
            <form>
                <div class="input-group">
                    <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <input type="tel" id="telefone" name="telefone" placeholder="(99) 9 9999-9999">
                </div>
                <div class="input-group">
                    <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem..." rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-button">Enviar</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
